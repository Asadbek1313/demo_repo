<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
        }

        .status {
            margin-top: 15px;
            display: inline-block;
            padding: 5px 10px;
            font-size: 12px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 20px;
            }

            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">
        <h1>GitHub Actions Demo Project</h1>

        <p>
            This is a simple project created to demonstrate automatic deployment
            using GitHub Actions. Every time code is pushed to the repository,
            the site is updated automatically.
        </p>

        <span class="status">Auto Deploy Enabled</span>

        <div class="footer">
            Built for educational purposes (DevOps basics)
        </div>
    </div>

</div>

</body>
</html>
